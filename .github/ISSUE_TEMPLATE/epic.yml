# Epics organize implementation work for an accepted proposal.
# See https://github.com/praxis-proxy/enhancements for the full lifecycle.
name: Epic
description: Define an outcome delivered through related features
type: Epic
labels: ["triage/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use an epic for an outcome spanning several features. After creation,
        link the features as native sub-issues; body references alone do not establish that relationship.
  - type: textarea
    id: what
    attributes:
      label: What
      description: Give a human-readable summary of what this epic delivers, who it is for, and what they will be able to do. Use domain language rather than implementation details.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: Explain clearly why this is needed. Describe the problem, who it affects, and how delivering this epic helps them. Write for a human reader without assuming technical context.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How
      description: Link existing discussions, designs, proposals, or review PRs using full URLs. Explain what each reference covers and which design defines the delivery scope. Track features as native sub-issues.
      placeholder: |
        - [Delivery design](https://...) — Scope and behaviour for this version.
        - [Discussion or proposal](https://...) — Context, decisions, and alternatives.

        Delivery is broken into the feature sub-issues under this epic.
    validations:
      required: true
